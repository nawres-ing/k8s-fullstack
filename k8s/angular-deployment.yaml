apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: angular-deployment
  name: angular-deployment
  namespace: k8s-fullstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-deployment
  template:
    metadata:
      labels:
        app: angular-deployment
    spec:
      containers:
      - image: nawresm/angular-app:3.2
        name: angular-app
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
