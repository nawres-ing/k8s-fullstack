apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: k8s-fullstack
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /user
        pathType: Prefix
        backend:
          service:
            name: spring-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: angular-service
            port:
              number: 80
